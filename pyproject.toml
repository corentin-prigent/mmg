[build-system]
requires      = ["py-build-cmake~=0.5.0"]
build-backend = "py_build_cmake.build"

[project]
name    = "mmg"
version = "1.0"

[tool.py_build_cmake.module]
name = "mmg"

[tool.py-build_cmake.dist]
include = ["CMakeLists.txt", "src/*/*.c"]

[tool.py-build_cmake.cmake]
minimum_version = "3.17"
build_type      = "Release"
build_args      = ["-j"]

